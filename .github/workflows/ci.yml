name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Tests
        run: swift test

      # Packaging is part of the product: a broken bundle.sh would only
      # surface at install time. The runner signs ad-hoc, matching the
      # project's default configuration.
      - name: Package the app
        run: ./Scripts/bundle.sh

      - name: Verify the generated bundle
        run: |
          set -euo pipefail
          test -x Presence.app/Contents/MacOS/Presence
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Presence.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" Presence.app/Contents/Info.plist
          codesign -dv Presence.app 2>&1 | grep -q "Identifier=com.rootless.presence"
